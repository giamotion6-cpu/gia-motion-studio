name: Reportar un problema
description: Ayúdanos a reproducir y corregir un comportamiento inesperado.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Descripción
      description: Explica qué ocurrió y qué esperabas que ocurriera.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Abre...
        2. Selecciona...
        3. Observa...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Dispositivo y navegador
      placeholder: Windows 11 · Chrome 128
  - type: textarea
    id: evidence
    attributes:
      label: Evidencia adicional
      description: Adjunta capturas, video o mensajes de consola si existen.

